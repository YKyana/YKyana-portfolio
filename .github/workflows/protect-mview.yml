name: Protect Marmoset viewer files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  protect:
    if: ${{ !contains(github.event.head_commit.message, '[mview-protected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Protect viewer packages
        shell: bash
        run: |
          set -euo pipefail

          CASH_KEY="df82ce168ecb6fb36fd8556782a959de6d8697bed0a3503e9f820bf266183f4a"
          CASH_IV="85b61ed047b643b10742d173a7cbd27c"
          CRATE_KEY="78f0750f42ae4de6d167702e4ebd9912682cca300d273f8ceecf65ad4445bc56"
          CRATE_IV="2b3403605e17e149206b7ed65b671fdd"

          protect_viewer () {
            SRC="$1"
            OUT="$2"
            HTML="$3"
            KEY="$4"
            IV="$5"
            LABEL="$6"

            if [ ! -f "$SRC" ]; then
              echo "Source already protected or missing: $SRC"
              return
            fi

            openssl enc -aes-256-ctr -K "$KEY" -iv "$IV" -in "$SRC" -out "$OUT"

            cat > "$HTML" <<EOF
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${LABEL} — Interactive 3D Model</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#252525}
body{display:grid;place-items:center;color:#aaa;font:12px Arial,Helvetica,sans-serif}
#status{letter-spacing:.12em;text-transform:uppercase}
</style>
<script src="https://viewer.marmoset.co/main/marmoset.js"></script>
</head>
<body>
<div id="status">Loading interactive model…</div>
<script>
const file="runtime.dat";
const keyHex="$KEY";
const counterHex="$IV";
const hex=s=>new Uint8Array((s.match(/../g)||[]).map(v=>parseInt(v,16)));

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

(async()=>{
  const response=await fetch(file,{cache:"no-store"});
  if(!response.ok) throw new Error("Viewer package unavailable");
  const encrypted=await response.arrayBuffer();
  const key=await crypto.subtle.importKey(
    "raw",
    hex(keyHex),
    {name:"AES-CTR"},
    false,
    ["decrypt"]
  );
  const decrypted=await crypto.subtle.decrypt(
    {name:"AES-CTR",counter:hex(counterHex),length:64},
    key,
    encrypted
  );
  const blobUrl=URL.createObjectURL(
    new Blob([decrypted],{type:"application/octet-stream"})
  );
  const status=document.getElementById("status");
  if(status) status.remove();
  document.body.style.display="block";
  marmoset.embed(blobUrl,{
    width:800,
    height:600,
    autoStart:true,
    fullFrame:true,
    pagePreset:false
  });
})().catch(error=>{
  console.error(error);
  const status=document.getElementById("status");
  if(status) status.textContent="Interactive viewer unavailable";
});
</script>
</body>
</html>
EOF

            rm -f "$SRC"
          }

          protect_viewer             "models/cash-register/cash-register.mview"             "models/cash-register/runtime.dat"             "models/cash-register/cash-register.html"             "$CASH_KEY" "$CASH_IV" "Cash Register"

          protect_viewer             "models/military-crate/military-crate.mview"             "models/military-crate/runtime.dat"             "models/military-crate/military-crate.html"             "$CRATE_KEY" "$CRATE_IV" "Military Crate"

      - name: Commit protected viewers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/cash-register models/military-crate
          if git diff --cached --quiet; then
            echo "No viewer changes to commit."
            exit 0
          fi
          git commit -m "[mview-protected] Protect public Marmoset viewer packages"
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>3D Modelling Diploma — Yana Kyslichenko</title>
<style>
:root{--bg:#05070a;--text:#f4f1ea;--muted:#9c9993;--line:rgba(244,241,234,.16);--o:#ff7a1a;--os:#ffad68}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{color:inherit}
body{background:radial-gradient(circle at 82% 10%,rgba(255,107,0,.12),transparent 28%),#05070a}
.viewer{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh}.top{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px clamp(16px,3vw,34px);border-bottom:1px solid var(--line);background:rgba(5,7,10,.88);backdrop-filter:blur(16px)}.title{min-width:0}.kicker{margin:0 0 4px;color:var(--os);font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.title h1{margin:0;font-size:clamp(16px,2vw,24px);letter-spacing:-.02em}.back{flex:0 0 auto;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-size:11px}.back:hover{border-color:var(--o);color:var(--os)}
.stage{position:relative;overflow:hidden;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}.canvas{position:absolute;left:50%;top:50%;width:min(980px,88vw);height:min(78vh,1160px);transform-origin:center center;will-change:transform}.paper{width:100%;height:100%;overflow:hidden;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.12)}iframe{width:100%;height:100%;border:0;background:#fff;pointer-events:none}
.controls{position:relative;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));border-top:1px solid var(--line);background:rgba(5,7,10,.9);backdrop-filter:blur(16px)}button,.verify{height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;background:#0b0e12;color:var(--text);font:inherit;font-size:12px;text-decoration:none;cursor:pointer}.zoomread{min-width:64px;color:var(--muted);font-size:11px}.reset{padding:0 15px}.verify{padding:0 16px;margin-left:8px;border-color:rgba(255,122,26,.55);color:var(--os)}button:hover,.verify:hover{border-color:var(--o)}.hint{position:absolute;left:50%;bottom:72px;z-index:5;transform:translateX(-50%);padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(5,7,10,.72);color:#aaa7a1;font-size:9px;letter-spacing:.08em;white-space:nowrap;pointer-events:none;transition:.4s}.hint.hide{opacity:0}
@media(max-width:700px){.viewer{grid-template-rows:auto 1fr auto}.top{padding:14px 16px}.kicker{font-size:8px}.title h1{font-size:16px}.back{padding:9px 12px;font-size:10px}.canvas{width:94vw;height:min(72vh,1120px)}.controls{gap:6px;padding-top:10px}.reset{display:none}.verify{margin-left:2px;padding:0 12px;font-size:10px}.hint{bottom:68px;font-size:8px}.paper{box-shadow:0 20px 55px rgba(0,0,0,.55)}}
@media(max-width:390px){.title h1{font-size:14px}.top{gap:10px}.back{padding:8px 10px}.zoomread{min-width:52px}.verify{padding:0 10px}}
</style>
</head>
<body>
<div class="viewer">
  <header class="top">
    <div class="title"><p class="kicker">Education & Certification</p><h1>3D Modelling · Genius.Space</h1></div>
    <a class="back" href="index.html#about">← Back</a>
  </header>
  <main class="stage" id="stage">
    <div class="canvas" id="canvas"><div class="paper"><iframe title="Genius.Space diploma verification" src="https://genius.space/crt-verify/?verify=06258cb7-addf-41cf-8bb5-3aa132aecc2d"></iframe></div></div>
    <div class="hint" id="hint">Wheel / pinch to zoom · drag to move</div>
  </main>
  <footer class="controls">
    <button id="minus" aria-label="Zoom out">−</button><span class="zoomread" id="read">100%</span><button id="plus" aria-label="Zoom in">+</button><button class="reset" id="reset">Reset</button><a class="verify" href="https://genius.space/crt-verify/?verify=06258cb7-addf-41cf-8bb5-3aa132aecc2d" target="_blank" rel="noopener noreferrer">Official verification ↗</a>
  </footer>
</div>
<script>
const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),read=document.getElementById('read'),hint=document.getElementById('hint');
let scale=1,x=0,y=0,pointers=new Map(),startDist=0,startScale=1,startMid=null,startXY=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){scale=clamp(scale,.7,5);canvas.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale})`;read.textContent=Math.round(scale*100)+'%'}
function zoomBy(amount){scale=clamp(scale+amount,.7,5);if(scale<=1){x=0;y=0}render();hideHint()}
function reset(){scale=1;x=0;y=0;render()}
function hideHint(){hint.classList.add('hide')}
document.getElementById('plus').onclick=()=>zoomBy(.25);document.getElementById('minus').onclick=()=>zoomBy(-.25);document.getElementById('reset').onclick=reset;
stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?.18:-.18)},{passive:false});
stage.addEventListener('dblclick',()=>{if(scale>1.05)reset();else{scale=2;render()}hideHint()});
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});stage.classList.add('dragging');startXY={x,y,px:e.clientX,py:e.clientY};hideHint();if(pointers.size===2){const a=[...pointers.values()];startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startScale=scale;startMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,ox:x,oy:y}});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2;scale=clamp(startScale*(d/startDist),.7,5);x=startMid.ox+(mx-startMid.x);y=startMid.oy+(my-startMid.y);render()}else if(pointers.size===1&&startXY&&scale>1){x=startXY.x+(e.clientX-startXY.px);y=startXY.y+(e.clientY-startXY.py);render()}});
function end(e){pointers.delete(e.pointerId);if(pointers.size===0){stage.classList.remove('dragging');startXY=null}else if(pointers.size===1){const a=[...pointers.values()][0];startXY={x,y,px:a.x,py:a.y}}}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);window.addEventListener('keydown',e=>{if(e.key==='Escape')location.href='index.html#about';if(e.key==='+')zoomBy(.25);if(e.key==='-')zoomBy(-.25);if(e.key==='0')reset()});render();setTimeout(hideHint,4500);
</script>
</body>
</html>

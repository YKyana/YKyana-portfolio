<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cash Register — Yana Kyslichenko</title><style>:root{--bg:#05070a;--text:#f4f1ea;--muted:#96928c;--line:rgba(244,241,234,.16);--o:#ff7a1a;--os:#ffad68;--p:clamp(22px,5vw,78px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;overflow-x:hidden;background:radial-gradient(circle at 84% 8%,rgba(255,107,0,.09),transparent 24%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}a{color:inherit}img{display:block;width:100%}#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-3;pointer-events:none}.topbar{position:fixed;inset:0 0 auto;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:22px var(--p);transition:.3s}.topbar.scrolled{background:rgba(5,7,10,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}.brand em{font-style:normal;color:var(--o)}nav{display:flex;gap:28px}nav a{text-decoration:none;color:#c6c2bb;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.hero{padding:150px var(--p) 70px}.hero h1{margin:0;font-size:clamp(4.4rem,9vw,9rem);line-height:.78;letter-spacing:-.075em;text-transform:uppercase}.hero h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(255,153,76,.88)}.meta{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:30px;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.section{padding:88px var(--p)}.section-title{margin:0 0 34px;font-size:clamp(2rem,4vw,4.2rem);line-height:.9;letter-spacing:-.045em;text-transform:uppercase}.section-title span{color:var(--o)}.final-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px}.final-grid img,.detail-grid img,.tech img{height:100%;object-fit:cover;border:1px solid rgba(255,255,255,.08);background:#090b0e}.final-grid .main{grid-row:span 2;min-height:650px}.final-grid .side{min-height:315px}.detail-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.detail-grid img:first-child{min-height:560px}.detail-stack{display:grid;gap:20px}.detail-stack img{min-height:270px}.viewer{overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#090b0e}.viewer iframe{display:block;width:100%;height:min(68vw,760px);min-height:520px;border:0}.hint{margin:12px 0 0;color:#77736e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.tech{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.tech figure{margin:0}.tech img{aspect-ratio:16/9}.tech figcaption{display:flex;justify-content:space-between;gap:18px;padding:12px 0;color:var(--muted);font-size:10px}.tech strong{color:#e8e3da;text-transform:uppercase;letter-spacing:.08em}.back{padding:70px var(--p) 100px}.back a{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;text-transform:uppercase;font-size:clamp(1.8rem,4vw,4rem);font-weight:800;letter-spacing:-.04em}.back a span:last-child{color:var(--o)}footer{display:flex;justify-content:space-between;gap:20px;padding:24px var(--p) 34px;color:#77736e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.reveal{opacity:0;transform:translateY(24px);transition:.7s}.reveal.visible{opacity:1;transform:none}@media(max-width:900px){.final-grid,.detail-grid,.tech{grid-template-columns:1fr}.final-grid .main,.final-grid .side,.detail-grid img:first-child{min-height:auto}.final-grid img{aspect-ratio:16/10}.viewer iframe{height:65vh;min-height:480px}}@media(max-width:700px){nav{gap:14px}nav a:nth-child(2){display:none}.hero{padding-top:115px}.section{padding-top:62px;padding-bottom:62px}.viewer iframe{min-height:430px}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}</style></head><body><canvas id="stars"></canvas><header class="topbar" id="topbar"><a class="brand" href="index.html"><em>YK</em> / 3D / 01</a><nav><a href="index.html#work">Selected work</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav></header><main><section class="hero"><h1 class="reveal">Cash<span>Register</span></h1><div class="meta reveal"><span>Hard Surface</span><span>Game-ready Prop</span><span>Maya</span><span>Substance 3D Painter</span><span>Marmoset Toolbag</span></div></section><section class="section"><h2 class="section-title reveal">Final <span>renders</span></h2><div class="final-grid reveal"><img class="main" src="images/cash-register.webp" alt="Final Cash Register render"><img class="side" src="images/IMG_0531.webp" alt="Cash Register render detail"><img class="side" src="images/cash-register-detail-drawer.webp" alt="Cash Register drawer render"></div></section><section class="section"><h2 class="section-title reveal">Details</h2><div class="detail-grid reveal"><img src="images/cash-register-detail-keys.webp" alt="Cash Register keys detail"><div class="detail-stack"><img src="images/cash-register-detail-drawer.webp" alt="Cash Register drawer detail"><img src="images/IMG_0531.webp" alt="Cash Register material detail"></div></div></section><section class="section"><h2 class="section-title reveal">Marmoset <span>viewer</span></h2><div class="viewer reveal"><iframe src="models/cash-register/cash-register.html" title="Interactive Cash Register 3D model" loading="lazy" allow="fullscreen" allowfullscreen></iframe></div><p class="hint reveal">Drag to rotate · Scroll to zoom</p></section><section class="section"><h2 class="section-title reveal">Breakdown</h2><div class="tech"><figure class="reveal"><img src="images/cash-register-high-poly.webp" alt="Cash Register high poly"><figcaption><strong>High Poly</strong><span>New render will replace this</span></figcaption></figure><figure class="reveal"><img src="images/cash-register-low-poly.webp" alt="Cash Register low poly"><figcaption><strong>Low Poly</strong><span>New render will replace this</span></figcaption></figure><figure class="reveal"><img src="images/cash-register-high-poly-wireframe.webp" alt="Cash Register wireframe"><figcaption><strong>Wireframe / Topology</strong><span>New clean render will replace this</span></figcaption></figure><figure class="reveal"><img src="images/cash-register-triangulated.webp" alt="Cash Register topology detail"><figcaption><strong>Topology Detail</strong><span>New close-up will replace this</span></figcaption></figure><figure class="reveal"><img src="images/cash-register-material-channels.webp" alt="Cash Register PBR texture channels"><figcaption><strong>Texture Maps</strong><span>PBR channels</span></figcaption></figure><figure class="reveal"><img src="images/cash-register-base-color-map.webp" alt="Cash Register base color map"><figcaption><strong>Base Color</strong><span>Texture atlas</span></figcaption></figure></div></section><section class="back"><a class="reveal" href="index.html#work"><span>Back to selected work</span><span>↗</span></a></section></main><footer><span>© 2026 Yana Kyslichenko</span><span>3D Hard Surface Artist</span></footer><script>const c=document.getElementById('stars'),x=c.getContext('2d');let s=[];function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);s=Array.from({length:Math.min(340,Math.floor(innerWidth*.22))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*.9+.12,r:Math.random()*1.1+.18,a:Math.random()*.55+.15,w:Math.random()>.9}))}function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const a of s){a.y+=.04+a.z*.1;if(a.y>innerHeight+3){a.y=-3;a.x=Math.random()*innerWidth}x.beginPath();x.fillStyle=a.w?`rgba(255,173,104,${a.a})`:`rgba(226,235,246,${a.a})`;x.arc(a.x,a.y,a.r*a.z,0,Math.PI*2);x.fill()}requestAnimationFrame(draw)}addEventListener('resize',resize);const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.1});document.querySelectorAll('.reveal').forEach(e=>o.observe(e));addEventListener('scroll',()=>document.getElementById('topbar').classList.toggle('scrolled',scrollY>20));resize();draw();</script></body></html>

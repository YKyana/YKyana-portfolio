nsition:transform .28s ease,opacity .28s ease}.gallery-img:hover{transform:scale(1.008);opacity:.96}.final-grid .main{grid-row:span 2;min-height:650px}.final-grid .side{min-height:315px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.detail-grid img{aspect-ratio:4/3;object-fit:cover}.viewer{overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#090b0e}.viewer iframe{display:block;width:100%;height:min(68vw,760px);min-height:520px;border:0}.hint{margin:12px 0 0;color:#77736e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.tech{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.tech figure{margin:0}.tech img{aspect-ratio:1/1;object-fit:contain}.tech .wide{grid-column:1/-1}.tech .wide img{aspect-ratio:auto;max-height:none}.tech figcaption{display:flex;justify-content:space-between;gap:18px;padding:12px 0;color:var(--muted);font-size:10px}.tech strong{color:#e8e3da;text-transform:uppercase;letter-spacing:.08em}.back{padding:70px var(--p) 100px}.back a{display:flex;justify-content:space-between;align-items:center;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;text-transform:uppercase;font-size:clamp(1.8rem,4vw,4rem);font-weight:800;letter-spacing:-.04em}.back a span:last-child{color:var(--o)}footer{display:flex;justify-content:space-between;gap:20px;padding:24px var(--p) 34px;color:#77736e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}.reveal{opacity:0;transform:translateY(24px);transition:.7s}.reveal.visible{opacity:1;transform:none}.lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:34px;background:rgba(2,3,5,.96);backdrop-filter:blur(14px)}.lightbox.open{display:flex}.lightbox img{width:auto;height:auto;max-width:min(94vw,1800px);max-height:90vh;object-fit:contain;box-shadow:0 30px 100px rgba(0,0,0,.55)}.lightbox-close,.lightbox-nav{position:absolute;border:0;background:rgba(15,17,20,.72);color:#fff;cursor:pointer;backdrop-filter:blur(10px)}.lightbox-close{top:22px;right:22px;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;font-size:26px;line-height:1}.lightbox-nav{top:50%;transform:translateY(-50%);width:52px;height:68px;border:1px solid var(--line);font-size:28px}.lightbox-prev{left:18px}.lightbox-next{right:18px}.lightbox-caption{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);max-width:75vw;color:#b7b2aa;font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:center}.lightbox-close:hover,.lightbox-nav:hover{border-color:var(--o);color:var(--os)}@media(max-width:900px){.final-grid,.tech{grid-template-columns:1fr}.final-grid .main,.final-grid .side{min-height:auto}.final-grid img{aspect-ratio:1/1}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer iframe{height:65vh;min-height:480px}.tech .wide{grid-column:auto}}@media(max-width:700px){nav{gap:14px}nav a:nth-child(2){display:none}.hero{padding-top:115px}.section{padding-top:62px;padding-bottom:62px}.detail-grid{grid-template-columns:1fr}.detail-grid img{aspect-ratio:16/10}.viewer iframe{min-height:430px}.lightbox{padding:18px}.lightbox-nav{width:42px;height:58px}.lightbox-prev{left:8px}.lightbox-next{right:8px}.lightbox-close{top:12px;right:12px}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.gallery-img{transition:none}}</style></head><body><canvas id="stars"></canvas><header class="topbar" id="topbar"><a class="brand" href="index.html"><em>YK</em> / 3D / 01</a><nav><a href="index.html#work">Selected work</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav></header><main><section class="hero"><h1 class="reveal">Cash<span>Register</span></h1><div class="meta reveal"><span>Hard Surface</span><span>Game-ready Prop</span><span>Maya</span><span>Substance 3D Painter</span><span>Marmoset Toolbag</span></div></se alt=""><button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next image">›</button><div class="lightbox-caption" id="lightboxCaption"></div></div><script>const c=document.getElementById('stars'),x=c.getContext('2d');let s=[];function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(d,0,0,d,0,0);s=Array.from({length:Math.min(340,Math.floor(innerWidth*.22))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,z:Math.random()*.9+.12,r:Math.random()*1.1+.18,a:Math.random()*.55+.15,w:Math.random()>.9}))}function draw(){x.clearRect(0,0,innerWidth,innerHeight);for(const a of s){a.y+=.04+a.z*.1;if(a.y>innerHeight+3){a.y=-3;a.x=Math.random()*innerWidth}x.beginPath();x.fillStyle=a.w?`rgba(255,173,104,${a.a})`:`rgba(226,235,246,${a.a})`;x.arc(a.x,a.y,a.r*a.z,0,Math.PI*2);x.fill()}requestAnimationFrame(draw)}addEventListener('resize',resize);const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.1});document.querySelectorAll('.reveal').forEach(e=>o.observe(e));addEventListener('scroll',()=>document.getElementById('topbar').classList.toggle('scrolled',scrollY>20));const gallery=[...document.querySelectorAll('.gallery-img')],lb=document.getElementById('lightbox'),lbImg=document.getElementById('lightboxImage'),lbCap=document.getElementById('lightboxCaption');let current=0;function show(i){current=(i+gallery.length)%gallery.length;const img=gallery[current];lbImg.src=img.currentSrc||img.src;lbImg.alt=img.alt||'Image preview';lbCap.textContent=img.alt||'';lb.classList.add('open');document.body.classList.add('lightbox-open')}function closeLb(){lb.classList.remove('open');document.body.classList.remove('lightbox-open');lbImg.src=''}gallery.forEach((img,i)=>img.addEventListener('click',()=>show(i)));document.getElementById('lightboxClose').addEventListener('click',closeLb);document.getElementById('lightboxPrev').addEventListener('click',e=>{e.stopPropagation();show(current-1)});document.getElementById('lightboxNext').addEventListener('click',e=>{e.stopPropagation();show(current+1)});lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});resize();draw();</script></body></html>
